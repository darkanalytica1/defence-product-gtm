<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Defence Product and Go-to-Market</title>
  <desc id="d">A capability need moves from gap to options to requirement to tender to contract. Supplier influence is high while the requirement is being written and close to zero once the tender is public.</desc>
  <style>
    .serif { font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, 'Times New Roman', serif; }
    .sans  { font-family: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono  { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .window { animation: pulse 8s ease-in-out infinite; }
    .track  { stroke-dasharray: 6 6; animation: flow 3s linear infinite; }
    .ring   { animation: ring 8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55 } 40% { opacity: 1 } }
    @keyframes flow { to { stroke-dashoffset: -48 } }
    @keyframes ring { 0%, 20%, 60%, 100% { stroke-opacity: .25 } 40% { stroke-opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
  </style>

  <rect width="1200" height="400" fill="#F6F4EF"/>
  <rect x=".5" y=".5" width="1199" height="399" fill="none" stroke="#DAD6CC"/>

  <!-- text column -->
  <text x="64" y="82" class="mono" font-size="12" letter-spacing="1.8" fill="#7A8088">DARKANALYTICA</text>
  <rect x="64" y="108" width="48" height="3" fill="#1F3A5F"/>
  <text x="62" y="176" class="serif" font-size="46" font-weight="600" fill="#1B1F24">Defence Product &amp; GTM</text>
  <text x="64" y="226" class="sans" font-size="19" fill="#4A5058">A field guide for product and commercial people</text>
  <text x="64" y="252" class="sans" font-size="19" fill="#4A5058">entering defence, where the requirement decides the deal.</text>
  <text x="64" y="330" class="mono" font-size="12" letter-spacing="1.2" fill="#7A8088">DEFENCE  ·  PROCUREMENT  ·  PRODUCT  ·  DUAL USE</text>

  <line x1="680" y1="56" x2="680" y2="344" stroke="#DAD6CC"/>

  <!-- mechanism strip: influence window upstream of the tender -->
  <g>
    <path class="window" d="M730,250 L730,160 C790,150 870,112 930,112 C975,112 995,200 1030,250 Z" fill="#F6E9E6" stroke="#A33A2B" stroke-width="1.5" stroke-opacity=".7"/>
    <text x="742" y="142" class="mono" font-size="12" fill="#A33A2B">INFLUENCE WINDOW</text>
    <line x1="1030" y1="96" x2="1030" y2="250" stroke="#7A8088" stroke-width="1.25" stroke-dasharray="3 4"/>
    <text x="1040" y="108" class="mono" font-size="12" fill="#7A8088">PUBLIC</text>
    <text x="1040" y="124" class="mono" font-size="12" fill="#7A8088">FROM HERE</text>

    <line x1="730" y1="250" x2="1130" y2="250" stroke="#DAD6CC" stroke-width="2"/>
    <line class="track" x1="730" y1="250" x2="1130" y2="250" stroke="#5B7083" stroke-width="1.75"/>

    <g fill="#fff" stroke="#1F3A5F" stroke-width="1.75">
      <circle cx="730" cy="250" r="7"/>
      <circle cx="830" cy="250" r="7"/>
      <circle cx="930" cy="250" r="7"/>
      <circle cx="1030" cy="250" r="7" stroke="#5B7083"/>
      <circle cx="1130" cy="250" r="7" stroke="#5B7083"/>
    </g>
    <circle class="ring" cx="930" cy="250" r="15" fill="none" stroke="#A33A2B" stroke-width="1.5"/>

    <circle r="5" fill="#1F3A5F">
      <animateMotion dur="8s" repeatCount="indefinite" path="M730,250 L1130,250"/>
    </circle>

    <g class="mono" font-size="12" fill="#1B1F24" text-anchor="middle">
      <text x="730" y="284">GAP</text>
      <text x="830" y="284">OPTIONS</text>
      <text x="930" y="284" fill="#A33A2B">REQUIREMENT</text>
      <text x="1030" y="284" fill="#4A5058">TENDER</text>
      <text x="1130" y="284" fill="#4A5058">CONTRACT</text>
    </g>
    <text x="712" y="352" class="mono" font-size="12" fill="#7A8088">CAPABILITY GAP  ·  REQUIREMENT  ·  TENDER</text>
  </g>
</svg>
